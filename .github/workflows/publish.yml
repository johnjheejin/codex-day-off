name: Verify and publish Afterglow
on:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'assets/afterglow-*.js*', 'assets/THREE-LICENSE.txt', 'assets/fonts/**', 'assets/brand/**', 'package*.json', 'tests/**', 'scripts/**', 'playwright.config.js', '.github/workflows/publish.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afterglow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm committed assets match the source
        run: git diff --exit-code -- index.html assets/afterglow-three.js assets/afterglow-garden.js assets/afterglow-three.js.LEGAL.txt assets/brand/*.svg
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          AFTERGLOW_EVIDENCE_DIR: test-results/local-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification
          path: test-results/
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dayoff.tmcowork.com
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-pages.mjs
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the repository secret CLOUDFLARE_API_TOKEN with Pages Edit permission for the configured account."
            exit 1
          fi
      - name: Deploy the verified static files
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: pages deploy dist --project-name=codex-day-off --branch=main --commit-hash=${{ github.sha }}
      - name: Verify the immutable deployment
        run: node scripts/check-deployment.mjs "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
      - run: npx playwright install --with-deps chromium
      - name: Check the deployed experience
        run: npx playwright test
        env:
          AFTERGLOW_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          AFTERGLOW_EVIDENCE_DIR: test-results/deployed-evidence
      - name: Confirm the public domain serves this production deployment
        run: node scripts/check-pages-production.mjs "$DEPLOYMENT_URL" "$GITHUB_SHA"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check public delivery and report security challenges
        run: |
          status=0
          node scripts/check-deployment.mjs https://dayoff.tmcowork.com || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::Cloudflare challenged this GitHub runner. Public-domain content verification is incomplete; the immutable deployment passed integrity and browser checks."
            echo '### Public-domain verification incomplete' >> "$GITHUB_STEP_SUMMARY"
            echo 'Cloudflare returned a managed challenge to this GitHub runner. The active domain binding, immutable deployment files and deployed browser experience were verified. Challenged responses are recorded as unmatched in production-verification; this is not a successful public-domain browser check.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo 'All public-domain files match the verified deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-verification
          path: |
            test-results/
            release-results/
          retention-days: 14
